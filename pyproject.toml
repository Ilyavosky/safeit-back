[project]
name = "aegis-back"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery>=5.7.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "dnspython>=2.9.2",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pyotp>=2.12.0",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pypdf>=7.1.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["slow: pruebas contra objetivos reales; requieren binarios y red"]
asyncio_default_fixture_loop_scope = "function"
